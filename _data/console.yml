# Данные ролевой консоли (вкладка «Консоль»).
# Файлы, уровни допуска и отделы можно свободно править — страница сама подхватит изменения.
#
# level у файла — какой уровень допуска нужен, чтобы его прочитать (0 — открыт всем).
# keyword у файла (необязательно) — ключевое слово: файл открывается командой `auth <СЛОВО>`,
# само слово нужно найти в других файлах сети. Уровень при этом не меняется.
# Допуск сотрудника = базовый уровень отдела при регистрации. Дальше его повышают вышестоящие
# сотрудники командой `promote`, а новых сотрудников заводят командой `adduser`
# (обе — от уровня admin_level и выше, выдать можно не выше собственного уровня).
# Администраторы (admin_level и выше) читают все файлы без ключевых слов.

title: "Anrox OS // ЗАКРЫТАЯ КОРПОРАТИВНАЯ СЕТЬ"
version: "версия: Anrox Citadel-Sys"
subtitle: "METADATA COMPRESSOR"

# Адрес API (Cloudflare Worker из папки worker/). Пусто — аккаунты и журнал хранятся
# только в браузере игрока. Инструкция: worker/README.md
api_url: "https://anroxcomputers.astronaut0space.workers.dev"

# строки проверок при запуске терминала (последний столбец — результат)
boot_checks:
  - "Проверка каналов связи"
  - "Шифрование"
  - "Целостность ядра Citadel-Sys"
  - "Сжатие метаданных"
  - "Журнал событий"
  - "Реестр сотрудников"
  - "Архив документов"
  - "Протокол допуска"
  - "Периметр безопасности"

# с какого уровня доступны команды adduser и promote
admin_level: 10

levels:
  0: "ГОСТЬ"
  1: "СОТРУДНИК"
  2: "ОФИЦЕР"
  3: "РЫЦАРЬ"
  4: "СОВЕТ"
  5: "СЕМЬЯ"
  10: "АДМИНИСТРАТОР"

departments:
  - id: staff
    name: "Рядовой сотрудник"
    level: 1
  - id: osn
    name: "ОСН — отряд специального назначения"
    level: 2
  - id: otkb
    name: "ОтКБ — отряд корпоративной безопасности"
    level: 2
  - id: dzis
    name: "ДЗИС — департамент защиты интеллектуальной собственности"
    level: 2
  - id: dkb
    name: "ДКБ — департамент корпоративной безопасности"
    level: 2

# слова для мини-игры «Взлом» (одинаковой длины)
hack_words:
  - "КОРПОРАТ"
  - "ПРОТОКОЛ"
  - "ШИФРОВКА"
  - "АРХИВИСТ"
  - "ДИРЕКТОР"
  - "МИНЕРАЛЫ"
  - "КОМАНДИР"
  - "АНОМАЛИЯ"
  - "ЗАЩИТНИК"

files:
  - path: /readme.txt
    level: 0
    title: "Добро пожаловать"
    text: |
      Закрытая корпоративная сеть АнКо.
      Доступ только для сотрудников. Все действия фиксируются.

      Основные команды:
        ls, cd, cat <файл>      — просмотр файлов
        search <слово>          — поиск по базе
        auth <СЛОВО>            — ввод ключевого слова
        mail / send <кому>      — внутренняя почта
        games / play <игра>     — развлечения для перерывов
        articles / read <номер>  — статьи архива АнКо
        help                    — полный список команд

      Часть файлов засекречена: для одних нужен допуск повыше (его выдают
      вышестоящие сотрудники), для других — ключевое слово. Слова нигде
      не выдаются — их можно найти только в самой сети.

  - path: /news/novosti.txt
    level: 1
    title: "Новости корпорации"
    text: |
      [ВНУТРЕННЯЯ РАССЫЛКА]
      — Реорганизация отрядов быстрого реагирования завершена.
      — Склад вооружений инвентаризован полностью, расхождений нет.
      — Напоминание: нелегальные поставки через жилой сектор
        остаются в зоне особого внимания ДКБ.
      — Обед в столовой для офицеров перенесён на 14:00.

  - path: /news/dress_code.txt
    level: 1
    title: "Форма одежды"
    text: |
      Сотрудникам запрещается покидать сектор без знака отличия.
      Оружие и снаряжение выдаются по накладной, под роспись.
      За порчу корпоративного имущества — удержание из жалованья.

  - path: /personnel/otkb_roster.txt
    level: 2
    title: "Состав ОтКБ"
    text: |
      ОТРЯД КОРПОРАТИВНОЙ БЕЗОПАСНОСТИ — штатное расписание.
      Лидер ОтКБ — офицер Рыцаря, координатор действий отряда.
      Инженер ОтКБ — боевой инженер, пилот шаттлов и механоидов.
      Медик ОтКБ — полевой медик.
      Офицер ОтКБ — боевая единица.

      Примечание дежурного: ключевое слово для закрытых приказов и проектов
      сменилось. Новое слово: ВЕКТОР-7. Не передавать по открытым каналам.

  - path: /personnel/dkb_orders.txt
    level: 2
    keyword: "ВЕКТОР-7"
    title: "Приказы ДКБ"
    text: |
      ПРИКАЗ №117. Отряд формируется при возникновении угрозы
      и расформировывается после её устранения.
      ПРИКАЗ №121. Любые контакты с представителями Нанотрейзен,
      Киберсан и Интердайн — только через уполномоченного офицера.
      ПРИКАЗ №124. Проверить сектор Дяди Корпората на предмет
      скрытого производства. Результаты — лично Совету.

      Для служебной переписки Совета использовать ключевое слово: РУБИН-12.

  - path: /projects/geode.txt
    level: 2
    keyword: "ВЕКТОР-7"
    title: "Проект «Жеода»"
    text: |
      Плотная жеода с красным минералом найдена при выполнении
      очередного контракта. Минерал отправлен на склад как
      побочный продукт.

      СТАТУС: изучение приостановлено.
      Причина: образцы проявляют активность, не описанную в
      технической документации.

  - path: /projects/red_mineral.txt
    level: 2
    keyword: "РУБИН-12"
    title: "Красный минерал — отчёт"
    text: |
      Образец №9 вызвал сбой всех приборов в радиусе трёх метров.
      Образец №14 вырос на сорок процентов за ночь без внешних
      источников питания.

      Вывод лаборатории: минерал — не побочный продукт.
      Минерал — основа дальнейшей стратегии корпорации.

      Окончательный допуск на материалы Семьи: ЧЁРНАЯ-ЖЕОДА.

  - path: /council/simato_family.txt
    level: 2
    keyword: "ЧЁРНАЯ-ЖЕОДА"
    title: "Семья Симато"
    text: |
      Только для членов Семьи.
      Совет подчиняется Семье. Семья не подчиняется никому.
      Основание корпорации — не случайность и не контракт.
      Подробности — при личной встрече.

  - path: /archive/former_employee.txt
    level: 2
    title: "Бывший сотрудник"
    text: |
      Дело закрыто. Допуск аннулирован. Личные вещи переданы на склад.
      Все терминалы, к которым имел доступ сотрудник, проверены.
      Если вы видите это сообщение — вы не должны были его видеть.
